name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON manifests
        run: |
          python3 - <<'EOF'
          import json
          from pathlib import Path
          for rel in ("claude-code/.claude-plugin/plugin.json", "claude-code/.mcp.json", "claude-code/hooks/hooks.json"):
              json.loads(Path(rel).read_text(encoding="utf-8"))
              print(f"ok: {rel}")
          EOF

      - name: Install KaidoPlan CLI (provides the MCP server binary)
        run: |
          brew tap cygnusyang/kaidoplan
          brew install kaidoplan-cli
          command -v kaidoplan-mcp

      - name: MCP stdio smoke test (launcher + handshake + tools/list)
        run: python3 .github/scripts/mcp_smoke.py claude-code/bin/kaidoplan-mcp 21

      - name: No dead relative links in READMEs
        run: python3 .github/scripts/check_links.py .
